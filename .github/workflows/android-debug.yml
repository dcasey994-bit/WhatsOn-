name: Android debug APK

# Builds an installable debug APK so the app can be tested on a real phone
# without a local Android Studio install.
#
# Each build is published to the rolling "debug-latest" release, so there is a
# fixed URL you can bookmark on the phone — no GitHub login, no zip to extract:
#
#   https://github.com/dcasey994-bit/WhatsOn-/releases/download/debug-latest/whatson-debug.apk
#
# It is also uploaded as a run artifact, which keeps a per-run copy around.

on:
  push:
    branches: [claude/live-events-map-vRHxH]
    # The native project is just a shell around the web build, so anything
    # outside apps/web (docs, SQL migrations) cannot change the APK.
    paths:
      - 'apps/web/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

# Needed to publish the release below; everything else here only reads.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Capacitor 8 / Android Gradle Plugin need JDK 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # compileSdk 36 is newer than the runner image ships with, so ask for it
      # explicitly rather than relying on Gradle to fetch it.
      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # These are baked into the bundle at build time. Without them the APK
      # installs fine but cannot reach Supabase, which looks like an app bug
      # rather than a missing secret — so fail here, loudly, instead.
      - name: Check required secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ]      && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Lengths only — GitHub masks the values themselves. A truncated paste
          # is the usual reason the APK cannot talk to Supabase while the web
          # app, which reads its config from Netlify, works fine.
          echo "VITE_SUPABASE_URL length:      ${#VITE_SUPABASE_URL}"
          echo "VITE_SUPABASE_ANON_KEY length: ${#VITE_SUPABASE_ANON_KEY}"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PAYMENT_LINK: ${{ secrets.VITE_STRIPE_PAYMENT_LINK }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: npm run build

      - name: Copy web build into the native project
        run: npx cap sync android

      - uses: gradle/actions/setup-gradle@v4

      # Gradle signs debug builds with ~/.android/debug.keystore, generating one
      # if it is missing. Every run gets a fresh VM, so without this each APK
      # was signed with a different key and Android refused to install it over
      # the previous one — meaning uninstall (and sign in again) every time.
      # Reusing one keystore makes builds install straight over the top.
      - name: Restore the shared debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is not set. This APK gets a throwaway signing key, so it will not install over an existing copy of the app — you would have to uninstall first. Add the secret to fix that."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "Debug keystore restored ($(wc -c < ~/.android/debug.keystore) bytes)"

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: whatson-debug-${{ github.run_number }}
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # A fixed, login-free URL to install from on the phone. The tag stays put
      # and only the attached APK is replaced, so the bookmark never changes.
      - name: Publish to the rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk whatson-debug.apk
          if ! gh release view debug-latest >/dev/null 2>&1; then
            gh release create debug-latest --title "Latest debug build" --notes "Rolling debug APK." --prerelease
          fi
          gh release upload debug-latest whatson-debug.apk --clobber
          gh release edit debug-latest --notes "Rolling debug APK, replaced on every build — not a real release. Build ${{ github.run_number }}, commit ${{ github.sha }}."
          echo "### APK ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<${{ github.server_url }}/${{ github.repository }}/releases/download/debug-latest/whatson-debug.apk>" >> $GITHUB_STEP_SUMMARY
