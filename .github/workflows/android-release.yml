name: Android release bundle

# Produces a signed .aab for the Play Console. Manual only — a release build
# is a deliberate act, and every run burns a versionCode that Play will never
# accept twice.
#
# Download the bundle from the run's Artifacts section, then upload it in the
# Play Console under the track you are releasing to.

on:
  # Also started by a push that changes release/android-version — the way
  # Claude starts a release, as it cannot use the Run workflow button.
  push:
    branches: [claude/live-events-map-vRHxH]
    paths: ['release/android-version']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name shown to users (e.g. 1.0.0) — leave blank to use release/android-version'
        required: false
      version_code:
        description: 'versionCode override — leave blank to use the run number'
        required: false

jobs:
  bundle:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      # The version comes from the "Run workflow" form when started by hand, or
      # from release/android-version when a push changed that file (see
      # release/README.md).
      - name: Resolve version
        run: |
          VERSION="${{ inputs.version_name }}"
          [ -z "$VERSION" ] && VERSION="$(tr -d '[:space:]' < release/android-version)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not like 1.2.3 (from release/android-version or the form)"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Its default package list includes the old "tools" package, which Google
      # has withdrawn; asking for it fails the step (Nov 2026). The SDK
      # platform and build tools are installed explicitly below.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Check required secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          VITE_CARTO_KEY: ${{ vars.VITE_CARTO_KEY }}
        run: |
          missing=""
          [ -z "$VITE_SUPABASE_URL" ]   && missing="$missing VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -z "$KEYSTORE_B64" ]        && missing="$missing ANDROID_UPLOAD_KEYSTORE_B64"
          [ -z "$KEYSTORE_PASSWORD" ]   && missing="$missing ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          # A variable, not a secret (it is public in every map tile URL).
          # Without it the map in the app says "API KEY REQUIRED".
          [ -z "$VITE_CARTO_KEY" ]         && missing="$missing VITE_CARTO_KEY(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets/variables:$missing"
            exit 1
          fi

      # Re-running a workflow keeps the original run_number and replays the
      # original inputs, so a re-run silently rebuilds the identical version
      # — same name, same code — and Play then rejects the upload. Catch it
      # here, where the cause is obvious.
      - name: Reject a re-run without an explicit versionCode
        if: ${{ github.run_attempt != 1 && !inputs.version_code }}
        run: |
          echo "::error::This is attempt ${{ github.run_attempt }} of run ${{ github.run_number }}, so it would rebuild versionCode ${{ github.run_number }} — the same one the first attempt produced, with the same version name. Start a fresh run from 'Run workflow' instead, or supply a versionCode override."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PAYMENT_LINK: ${{ secrets.VITE_STRIPE_PAYMENT_LINK }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          # A variable, not a secret: the key is public in every map tile URL.
          VITE_CARTO_KEY: ${{ vars.VITE_CARTO_KEY }}
        run: npm run build

      - name: Copy web build into the native project
        run: npx cap sync android

      - name: Restore the upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/upload.keystore"
          echo "Upload keystore restored ($(wc -c < "$RUNNER_TEMP/signing/upload.keystore") bytes)"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed bundle
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          # The run number is monotonic and unique, which is all Play asks of a
          # versionCode. The override exists for the case where Play has
          # already seen a higher one and the run number would be rejected.
          ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          ANDROID_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Confirm the bundle is signed
        working-directory: apps/web/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          # An unsigned bundle uploads and is then rejected by Play with a
          # confusing message, so check here where the cause is obvious.
          if unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC|DSA)'; then
            echo "Bundle is signed."
          else
            echo "::error::Bundle is NOT signed — check the keystore secrets."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: whatson-release-${{ env.VERSION_NAME }}-${{ github.run_number }}
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          echo "### Release bundle ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- versionName: \`${{ env.VERSION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- versionCode: \`${{ inputs.version_code || github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download it from Artifacts below and upload in the Play Console." >> $GITHUB_STEP_SUMMARY
